name: BumpVersion

on:
  workflow_run:
    workflows: ["Build Base Image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  bump-tag-version:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    concurrency:
      cancel-in-progress: true
      group: bump-version-${{ github.ref }}
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Tag
        id: tag_version
        uses: masgeek/github-tag-action@release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: ""
          create_annotated_tag: true

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1.16.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Version ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          makeLatest: true
          allowUpdates: true
          generateReleaseNotes: true
          skipIfReleaseExists: false

  publish:
    needs: bump-tag-version
    if: needs.bump-tag-version.result == 'success'
    uses: ./.github/workflows/publish.yml
    with:
      php_version: '8.4'
    secrets: inherit
