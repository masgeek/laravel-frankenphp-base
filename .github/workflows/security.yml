name: Container Security

on:
  pull_request:
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: local/laravel-frankenphp-base:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/laravel-frankenphp-base:scan
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
