name: Build Base Image

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: base-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          tags: local/laravel-frankenphp-base:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
