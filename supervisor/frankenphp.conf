[program:frankenphp]
command=frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
directory=%(ENV_APP_BASE_PATH)s
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopsignal=SIGTERM
stopwaitsecs=30
priority=10
environment=XDG_CONFIG_HOME="/tmp/caddy/config",XDG_DATA_HOME="/tmp/caddy/data"
