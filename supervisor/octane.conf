[program:octane]
command=/bin/sh -c 'exec php artisan octane:frankenphp --host=0.0.0.0 --port=80 --admin-host=127.0.0.1 --admin-port=2019 --workers="${OCTANE_WORKERS:-auto}" --max-requests="${OCTANE_MAX_REQUESTS:-500}" --caddyfile=/etc/frankenphp/Caddyfile'
directory=%(ENV_APP_BASE_PATH)s
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=90
environment=XDG_CONFIG_HOME="/tmp/caddy/config",XDG_DATA_HOME="/tmp/caddy/data"
